# FPL Selector — weekly re-tune of the model's factor strengths.
# Replays last season + this season to date and keeps a new strength only if it lowers RMSE by a margin
# (worker/fpl_worker/tune.py). Weekly because it takes ~30-45 min of Actions time.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Needs migration 0008 (model_params).
name: fpl-retune

on:
  schedule:
    - cron: "40 3 * * 2" # Tuesdays 03:40 UTC, after the weekend's gameweek is final
  workflow_dispatch: {}

concurrency:
  group: fpl-retune
  cancel-in-progress: false

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Re-tune factor strengths
        run: uv run python -m fpl_worker.tune --run
