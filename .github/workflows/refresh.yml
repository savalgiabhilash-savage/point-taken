# FPL Selector — data pipeline (fast, no LLM cost).
# FPL API -> Supabase, then advanced stats, projections, optimizer, team sync.
# Runs every 2 hours so ownership / price / status / projections stay fresh without a local machine.
# The news/sentiment step (which spends Anthropic credits) runs separately in news.yml, twice daily.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FPL_ENTRY_ID
name: fpl-data

on:
  schedule:
    # 20 past every 3rd hour (UTC). Deliberately off the top of the hour — GitHub's scheduler
    # is heavily delayed/skipped at :00 (peak load), so an off-peak minute fires more reliably.
    # Every 2 h: GitHub drops or delays many scheduled runs, so a 3 h cron often ran only ~4x/day.
    # Hourly would exceed the private repo's 2,000 free Actions minutes/month (~3 min per run).
    - cron: "20 */2 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab / gh CLI

concurrency:
  group: fpl-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      # 1) Foundation: FPL API -> teams/players/fixtures. Ownership / price / status — the freshest bit.
      #    Runs first so this critical data lands even if a later (Understat-dependent) step flakes.
      - name: Refresh FPL data
        run: uv run python -m fpl_worker.refresh --refresh

      # 2) Advanced stats: Understat crosswalk + custom FDR (slow-moving baseline).
      - name: Enrich (crosswalk + FDR)
        # Only feeds the Fixtures-page difficulty display; projections don't depend on it, so an
        # Understat outage mustn't stop the rest of the pipeline.
        continue-on-error: true
        run: uv run python -m fpl_worker.enrich --all

      # 3) Rules-based xPts projections (reflect updated availability).
      #    Horizon 38 so the Optimizer's user-selectable plan length can span the rest of the season.
      - name: Model (projections)
        run: uv run python -m fpl_worker.model --run --horizon 38

      # 4) Best XI predictions + accuracy scoring + model calibration.
      #    Safe before migration 0003 is applied (it prints a hint and exits).
      - name: Predict (best XI + accuracy)
        run: uv run python -m fpl_worker.predict --run

      # 5) Sync every user's live team (no-op preseason; keeps the snapshot). Before the optimizer, so
      #    each plan uses the latest squad, bank and free transfers.
      - name: Sync team
        run: uv run python -m fpl_worker.sync_team

      # 6) Multi-week transfer path + chip timing.
      - name: Optimize (multi-week + chips)
        run: uv run python -m fpl_worker.optimize --plan

      # 7) Push alerts: a player in a subscriber's squad newly flagged (needs VAPID secrets; skips without).
      - name: Notify (injury alerts)
        continue-on-error: true
        run: uv run python -m fpl_worker.notify --injuries
