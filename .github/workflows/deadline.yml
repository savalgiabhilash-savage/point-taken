# FPL Selector — pre-deadline refresh. About 100 min before each gameweek deadline: latest injury flags,
# news, predicted line-ups and transfers (the crowd signal is strongest at the deadline), then
# projections, the Best XI snapshot, team sync and the optimizer, so the plan and the Deadline check
# use the freshest data. One run per GW (~10 Actions minutes, ~$1-2 of Claude credits).
# The schedule lists each remaining deadline (generated by `python -m fpl_worker.deadline_cron`); every
# run re-checks the deadline first, so a moved deadline just exits. Re-generate when FPL reschedules.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FPL_ENTRY_ID, ANTHROPIC_API_KEY
name: fpl-deadline

on:
  schedule:
    - cron: "50 15 23 10 *"  # GW8, deadline Fri 23 Oct 17:30 UTC
    - cron: "20 9 31 10 *"  # GW9, deadline Sat 31 Oct 11:00 UTC
    - cron: "50 16 6 11 *"  # GW10, deadline Fri 06 Nov 18:30 UTC
    - cron: "20 9 21 11 *"  # GW11, deadline Sat 21 Nov 11:00 UTC
    - cron: "50 16 27 11 *"  # GW12, deadline Fri 27 Nov 18:30 UTC
    - cron: "50 16 1 12 *"  # GW13, deadline Tue 01 Dec 18:30 UTC
    - cron: "20 9 5 12 *"  # GW14, deadline Sat 05 Dec 11:00 UTC
    - cron: "50 11 12 12 *"  # GW15, deadline Sat 12 Dec 13:30 UTC
    - cron: "20 9 19 12 *"  # GW16, deadline Sat 19 Dec 11:00 UTC
    - cron: "20 9 26 12 *"  # GW17, deadline Sat 26 Dec 11:00 UTC
    - cron: "20 16 29 12 *"  # GW18, deadline Tue 29 Dec 18:00 UTC
    - cron: "50 16 1 1 *"  # GW19, deadline Fri 01 Jan 18:30 UTC
    - cron: "20 16 5 1 *"  # GW20, deadline Tue 05 Jan 18:00 UTC
    - cron: "50 11 16 1 *"  # GW21, deadline Sat 16 Jan 13:30 UTC
    - cron: "50 11 23 1 *"  # GW22, deadline Sat 23 Jan 13:30 UTC
    - cron: "50 11 30 1 *"  # GW23, deadline Sat 30 Jan 13:30 UTC
    - cron: "50 11 6 2 *"  # GW24, deadline Sat 06 Feb 13:30 UTC
    - cron: "50 16 10 2 *"  # GW25, deadline Wed 10 Feb 18:30 UTC
    - cron: "50 11 20 2 *"  # GW26, deadline Sat 20 Feb 13:30 UTC
    - cron: "50 11 27 2 *"  # GW27, deadline Sat 27 Feb 13:30 UTC
    - cron: "50 16 3 3 *"  # GW28, deadline Wed 03 Mar 18:30 UTC
    - cron: "50 11 13 3 *"  # GW29, deadline Sat 13 Mar 13:30 UTC
    - cron: "50 11 20 3 *"  # GW30, deadline Sat 20 Mar 13:30 UTC
    - cron: "50 10 10 4 *"  # GW31, deadline Sat 10 Apr 12:30 UTC
    - cron: "50 10 17 4 *"  # GW32, deadline Sat 17 Apr 12:30 UTC
    - cron: "50 10 24 4 *"  # GW33, deadline Sat 24 Apr 12:30 UTC
    - cron: "50 10 1 5 *"  # GW34, deadline Sat 01 May 12:30 UTC
    - cron: "50 10 8 5 *"  # GW35, deadline Sat 08 May 12:30 UTC
    - cron: "50 10 15 5 *"  # GW36, deadline Sat 15 May 12:30 UTC
    - cron: "50 10 23 5 *"  # GW37, deadline Sun 23 May 12:30 UTC
    - cron: "50 11 30 5 *"  # GW38, deadline Sun 30 May 13:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no deadline is near"
        type: boolean
        default: false

concurrency:
  group: fpl-data   # shares the data pipeline's lock, so it never overlaps a scheduled refresh
  cancel-in-progress: false

jobs:
  deadline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Deadline near?
        id: near
        run: |
          if [ "${{ inputs.force }}" = "true" ] || uv run python -m fpl_worker.deadline_cron --check; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh FPL data
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.refresh --refresh

      - name: News & sentiment
        if: steps.near.outputs.go == 'true' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: uv run python -m fpl_worker.news_job --run

      - name: Predicted line-ups
        if: steps.near.outputs.go == 'true' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: uv run python -m fpl_worker.lineups --run

      - name: Model (projections)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.model --run --horizon 38

      - name: Predict (best XI + accuracy)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.predict --run

      - name: Sync team
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.sync_team

      - name: Optimize (multi-week + chips)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.optimize --plan
