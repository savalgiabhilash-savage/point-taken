# FPL Selector — pre-deadline refresh, about 100 min before each gameweek deadline: latest injury flags, news,
# predicted line-ups (their only run each GW) and transfers (the crowd signal is strongest at the deadline),
# then projections, the Best XI snapshot, team sync and the optimizer, so the plan and the Deadline check use
# the freshest data. ~10 Actions minutes and ~$1-2 of Claude credits per GW.
# Started by Supabase (migration 0011: a pg_cron timer asks GitHub to start this workflow), because GitHub's
# own schedule ran hours late. The run re-checks the deadline first, so a stray start just exits.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FPL_ENTRY_ID, ANTHROPIC_API_KEY
name: fpl-deadline

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no deadline is near"
        type: boolean
        default: false

concurrency:
  group: fpl-data   # shares the data pipeline's lock, so it never overlaps a scheduled refresh
  cancel-in-progress: false

jobs:
  deadline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Deadline near?
        id: near
        run: |
          if [ "${{ inputs.force }}" = "true" ] || uv run python -m fpl_worker.deadline_cron --check; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh FPL data
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.refresh --refresh

      - name: News & sentiment
        if: steps.near.outputs.go == 'true' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: uv run python -m fpl_worker.news_job --run

      - name: Predicted line-ups
        if: steps.near.outputs.go == 'true' && env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: uv run python -m fpl_worker.lineups --run

      - name: Model (projections)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.model --run --horizon 38

      - name: Predict (best XI + accuracy)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.predict --run

      - name: Sync team
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.sync_team

      - name: Optimize (multi-week + chips)
        if: steps.near.outputs.go == 'true'
        run: uv run python -m fpl_worker.optimize --plan
