# FPL Selector — news & sentiment (LLM classification via Claude).
# Runs twice daily (not every cycle) because each run spends Anthropic credits.
# Reads whatever players are in Supabase (kept fresh by fpl-data), so it runs independently.
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY
name: fpl-news

on:
  schedule:
    - cron: "30 6,18 * * *" # 06:30 & 18:30 UTC — after overnight and around midday team news
  workflow_dispatch: {}

concurrency:
  group: fpl-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      # Only runs when ANTHROPIC_API_KEY is set, so the workflow stays green even without the key.
      - name: News & sentiment
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: uv run python -m fpl_worker.news_job --run
