[project]
name = "fpl-worker"
version = "0.1.0"
description = "FPL data ETL worker: official FPL API -> Supabase"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "supabase>=2.6",
    "python-dotenv>=1.0",
    "soccerdata>=1.8",
    "rapidfuzz>=3.9",
    "highspy>=1.7",
    "anthropic>=0.40",
    "pywebpush>=2.0",
]

# This is an application, not a distributable library — don't try to build/install it,
# just manage the venv + dependencies. Run modules with: uv run python -m fpl_worker.refresh
[tool.uv]
package = false
